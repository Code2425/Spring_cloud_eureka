server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    # Overridable via env (docker-compose sets EUREKA_HOST=eureka-server)
    hostname: ${EUREKA_HOST:localhost}
  client:
    # A registry does not register itself and does not fetch the registry
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Don't wait for peers on startup (single-node demo)
    wait-time-in-ms-when-sync-empty: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info
