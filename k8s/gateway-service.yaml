# gateway-service on KIND (assumed port 8080 — adjust containerPort if yours differs).
# If your gateway routes hardcode http://localhost:8081 etc., override them
# here with env vars pointing at the K8s Service names instead, e.g.:
#   - name: PRODUCT_SERVICE_URL
#     value: "http://product-service:8081"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway-service }
  template:
    metadata:
      labels: { app: gateway-service }
    spec:
      containers:
      - name: gateway-service
        image: DOCKERHUB_USER/gateway-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka"
        readinessProbe:
          tcpSocket: { port: 8080 }
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 8080 }
          initialDelaySeconds: 120
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector: { app: gateway-service }
  ports:
  - port: 8080
    targetPort: 8080
