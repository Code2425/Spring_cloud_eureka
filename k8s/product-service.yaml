# product-service on KIND.
# KEY LINE: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE points at the K8s Service
# name (eureka-server), NOT localhost. Inside a pod, localhost = the pod
# itself — hardcoding localhost:8761 is the #1 reason services can't find
# Eureka on Kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      containers:
      - name: product-service
        image: DOCKERHUB_USER/product-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka"
        readinessProbe:
          tcpSocket: { port: 8081 }
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 8081 }
          initialDelaySeconds: 120
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector: { app: product-service }
  ports:
  - port: 8081
    targetPort: 8081
